<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecuaciones y sistemas paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: cuaderno de clase, mismo estilo que la página de polinomios
   IDEA: cuaderno de ejercicios con pestañas por tipo de ecuación
   PICTURE: la propia lista de ejercicios, que se despliega paso a paso
   COLOUR and TYPE: papel, tinta oscura y un acento naranja; Fraunces, IBM Plex Sans y STIX para las fórmulas
   LAYOUT: cabecera, pestañas, panel de opciones y 5 ejercicios */
:root{--paper:#f6f1e7;--card:#fffdf8;--card2:#fff;--soft:#fcf9f2;--ink:#1d2733;--onink:#fff;--muted:#6b6457;--line:#e3dacb;
  --accent:#c2410c;--accent-soft:#fbe6d9;--ok:#166534;--ok-soft:#dcf2e3;--bad:#9f1239;--bad-soft:#fbe4ea;
  --math:'STIX Two Text','Cambria Math',serif;color-scheme:light}
:root[data-theme=dark]{--paper:#14181d;--card:#1c2229;--card2:#20272f;--soft:#181d23;--ink:#ece6da;--onink:#14181d;--muted:#a39c8f;--line:#333c46;
  --accent:#f0804a;--accent-soft:#3a2418;--ok:#7dd3a0;--ok-soft:#173226;--bad:#f49ab0;--bad-soft:#3b1a24;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#14181d;--card:#1c2229;--card2:#20272f;--soft:#181d23;--ink:#ece6da;--onink:#14181d;--muted:#a39c8f;--line:#333c46;
  --accent:#f0804a;--accent-soft:#3a2418;--ok:#7dd3a0;--ok-soft:#173226;--bad:#f49ab0;--bad-soft:#3b1a24;color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;overflow-x:clip;
  background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--ink) 7%,transparent) 1px, transparent 0);background-size:22px 22px}
.wrap{max-width:980px;margin:0 auto;padding:32px 20px 80px}
header h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(28px,4.5vw,44px);margin:0 0 4px;letter-spacing:-.5px;line-height:1.08}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 15px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;min-height:40px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.panel h2{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.small{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--onink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--onink);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.btn.alt{background:transparent;color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.m{font-family:var(--math);font-size:1.08em}
.big{font-family:var(--math);font-size:clamp(20px,3.2vw,27px);margin:8px 0;overflow-x:auto;white-space:nowrap;padding:4px 0}
.mid{font-family:var(--math);font-size:20px;margin:8px 0;overflow-x:auto;padding:2px 0;white-space:nowrap}
sup{font-size:.68em}sub{font-size:.68em}
sup sup{font-size:.85em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.2}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em .1em}
.frac>span:last-child{padding:.1em .25em 0}
.rad{border-top:1.5px solid currentColor;padding:0 .12em;margin-left:1px}
.list-head{margin:28px 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.list-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0}
.list-head span{color:var(--muted);font-size:14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.ex.open{border-color:var(--ink)}
.ex-head{display:flex;align-items:center;gap:14px;padding:14px 18px}
.stmt{flex:1;font-family:var(--math);font-size:clamp(18px,2.8vw,24px);overflow-x:auto;white-space:nowrap;padding:4px 0}
.ex-body{border-top:1px solid var(--line);padding:6px 18px 18px;background:var(--soft)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.progress{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-family:'IBM Plex Sans';font-size:13px;font-weight:600;flex:none}
.ex-head .num{background:var(--ink);color:var(--onink)}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-top:12px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}}
.step h3{margin:0 0 8px;font-family:'Fraunces',serif;font-weight:500;font-size:19px;display:flex;gap:10px;align-items:center}
.step p{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-family:var(--math);font-size:16px;padding:3px 10px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.ruf-wrap{overflow-x:auto;margin:12px 0}
table.ruf{border-collapse:collapse;font-family:var(--math);font-size:20px;margin:0 auto}
table.ruf td{padding:5px 13px;text-align:center;min-width:40px}
table.ruf td.rc{border-right:2px solid var(--ink);color:var(--accent);font-weight:600}
table.ruf tr.res td{border-top:2px solid var(--ink)}
table.ruf td.rem{border-left:2px solid var(--ink);background:var(--ok-soft);color:var(--ok);font-weight:600}
table.ruf tr.prod td{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}
.box{background:var(--accent-soft);border-radius:10px;padding:8px 14px;margin-top:10px;overflow-x:auto}
.final{border:2px solid var(--ink)}
.rootlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.root{font-family:var(--math);font-size:19px;background:var(--ok-soft);color:var(--ok);padding:5px 12px;border-radius:10px;white-space:nowrap}
.root small{font-family:'IBM Plex Sans';font-size:12px;opacity:.8;margin-left:4px}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px}
.chk{border-radius:10px;padding:8px 12px;margin:8px 0;overflow-x:auto;font-size:15px}
.chk.ok{background:var(--ok-soft)}
.chk.bad{background:var(--bad-soft)}
.chk b{white-space:nowrap}
.badt{color:var(--bad);font-family:'IBM Plex Sans';font-size:15px}
.sys{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.sys .brace{font-size:2.5em;font-weight:300;line-height:1;font-family:var(--math)}
.sys.n3 .brace{font-size:3.6em}
.sys .eqs{display:flex;flex-direction:column;gap:2px}
.mxw{display:flex;align-items:center;gap:10px;overflow-x:auto;margin:12px 0;font-family:var(--math);font-size:19px;padding-bottom:2px}
.mxs div{height:36px;line-height:36px;white-space:nowrap;color:var(--muted);font-size:16px}
.mxs.ops div{color:var(--accent);font-family:'IBM Plex Sans';font-size:14px}
.mxb{border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:10px;padding:0 6px;flex:none}
.mxb table{border-collapse:collapse}
.mxb td{height:36px;padding:0 12px;text-align:right;min-width:42px}
.mxb td.sep{border-left:1.5px solid var(--muted)}
.mxb tr.chg td{color:var(--accent);font-weight:600}
.red{display:inline-flex;flex-direction:column;align-items:flex-end}
.red .mid{margin:2px 0}
.red .sum{border-top:2px solid var(--ink);padding-top:4px}
.hidden{display:none}
@media (max-width:600px){.ex-head{flex-wrap:wrap}.stmt{flex-basis:100%;order:3}.wrap{padding:24px 14px 60px}.step{padding:14px}.ex-body{padding:6px 10px 14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ecuaciones y sistemas</h1>
    <p>Elige un tipo, genera 5 ejercicios y abre la solución paso a paso de cada uno.</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="panel">
    <h2 id="pTitle"></h2>
    <p id="pDesc"></p>
    <div class="row">
      <div class="row" id="subRow"><label class="small">Tipo</label><div class="seg" id="subs"></div></div>
      <button class="btn acc" id="gen">Generar 5 ejemplos nuevos</button>
    </div>
  </div>
  <div id="list"></div>
</div>

<script>
{
/* =========================================================
   Utilidades
   ========================================================= */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n<0?'−'+Math.abs(n):''+(n===0?0:n);
const par=n=>n<0?'('+fmt(n)+')':fmt(n);
const dec=(v,d=4)=>(+v.toFixed(d)).toString().replace('.',',').replace('-','−');
const V=v=>`<i>${v}</i>`;
const X=V('x'),Y=V('y'),Z=V('z');
const SUB=['₁','₂','₃','₄','₅','₆','₇'];
const EQ=i=>`E<sub>${i+1}</sub>`;
const isSq=n=>n>=0&&Number.isInteger(Math.sqrt(n));
function trim(p){p=p.slice();while(p.length>1&&p[0]===0)p.shift();return p}
function add(a,b){const n=Math.max(a.length,b.length),r=[];for(let i=0;i<n;i++)r.push((a[a.length-n+i]||0)+(b[b.length-n+i]||0));return trim(r)}
const scale=(p,k)=>trim(p.map(a=>a*k));
const sub=(a,b)=>add(a,scale(b,-1));
function mul(a,b){const r=new Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y));return trim(r)}
const evalP=(c,x)=>c.reduce((acc,a)=>acc*x+a,0);
const nTerms=p=>p.filter(a=>a!==0).length;
const lead=p=>p.find(a=>a!==0)||0;
function divisors(n){n=Math.abs(n);const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d}
function ruffini(c,r){const q=[c[0]],prods=[];for(let i=1;i<c.length;i++){const p=r*q[i-1];prods.push(p);q.push(c[i]+p)}return {q:q.slice(0,-1),rem:q[q.length-1],prods}}
function sqrtSplit(n){let k=1;for(let i=Math.floor(Math.sqrt(n));i>1;i--){if(n%(i*i)===0){k=i;break}}return {k,m:n/(k*k)}}

function polyHTML(c,v='x'){
  const n=c.length-1;let s='';
  c.forEach((a,i)=>{if(a===0)return;const p=n-i,abs=Math.abs(a);
    let t=(abs===1&&p>0)?'':''+abs;if(p>0)t+=V(v)+(p>1?'<sup>'+p+'</sup>':'');
    s+=s===''?(a<0?'−':'')+t:(a<0?' − ':' + ')+t;});
  return s||'0';
}
function linHTML(terms){let s='';terms.forEach(([a,v])=>{if(!a)return;const abs=Math.abs(a);const t=(abs===1&&v?'':''+abs)+v;s+=s===''?(a<0?'−':'')+t:(a<0?' − ':' + ')+t});return s||'0'}
const fracBox=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
function fracHTML(p,q){if(q<0){p=-p;q=-q}const g=gcd(p,q)||1;p/=g;q/=g;if(q===1)return fmt(p);return (p<0?'−':'')+fracBox(Math.abs(p),q)}
const sq=v=>`√<span class="rad">${v}</span>`;
const wrap=(c,v='x')=>nTerms(c)>1?'('+polyHTML(c,v)+')':polyHTML(c,v);
const lf=r=>r===0?X:'('+polyHTML([1,-r])+')';
function rat(p,q=1){if(q<0){p=-p;q=-q}const g=gcd(p,q)||1;p/=g;q/=g;return {p,q,v:p/q,h:fracHTML(p,q)}}
const addR=(a,b)=>rat(a.p*b.q+b.p*a.q,a.q*b.q);
const PW=(b,e)=>`${b}<sup>${e}</sup>`;
function subLin(p,q,x){if(p===0)return fmt(q);return (p===1?'':p===-1?'−':fmt(p)+'·')+par(x)+(q>0?' + '+q:q<0?' − '+(-q):'')}
function normalize(P){let g=P.reduce((a,b)=>gcd(a,b),0)||1;if(lead(P)<0)g=-g;return {P:P.map(c=>c/g||0),g}}
function intRoots(P){
  if(P.length===2){const r=-P[1]/P[0];return Number.isInteger(r)?[r]:null}
  if(P.length===3){const [a,b,c]=P,D=b*b-4*a*c;if(D<0||!isSq(D))return null;const s=Math.sqrt(D),r1=(-b+s)/(2*a),r2=(-b-s)/(2*a);return Number.isInteger(r1)&&Number.isInteger(r2)?[r1,r2]:null}
  return null;
}
function sqrtRat(r){
  const {p,q}=r;
  if(isSq(p)&&isSq(q)){const s=rat(Math.sqrt(p),Math.sqrt(q));return {v:s.v,h:s.h,exact:true}}
  const {k,m}=sqrtSplit(p*q),g=gcd(k,q),K=k/g,Q=q/g,num=(K===1?'':K)+sq(m);
  return {v:Math.sqrt(p/q),h:Q===1?num:fracBox(num,Q),exact:false};
}
const sysHTML=lines=>`<span class="sys n${lines.length}"><span class="brace">{</span><span class="eqs">${lines.map(l=>`<span>${l}</span>`).join('')}</span></span>`;

/* ---------- ecuación de segundo grado (con casos incompletos) ---------- */
function quad(a,b,c,v='x'){
  const x=V(v),eq=`<span class="m">${polyHTML([a,b,c],v)} = 0</span>`;
  if(a===0){
    const r=rat(-c,b);
    return {roots:[r],h:`<p>Es de primer grado: ${eq}</p><div class="mid">${polyHTML([b,0],v)} = ${fmt(-c)} &nbsp;→&nbsp; ${x} = ${b===1?'':fracBox(fmt(-c),fmt(b))+' = '}<b>${r.h}</b></div>`};
  }
  if(c===0&&b!==0){
    const r=rat(-b,a);
    return {roots:[rat(0),r],h:`<p>Es incompleta (no tiene término independiente): ${eq}. Sacamos factor común ${x}:</p>
      <div class="mid">${x}·(${polyHTML([a,b],v)}) = 0</div>
      <p>Un producto vale cero si alguno de sus factores es cero:</p>
      <div class="mid">${x}<sub>1</sub> = <b>0</b> &nbsp;&nbsp;·&nbsp;&nbsp; ${polyHTML([a,b],v)} = 0 → ${x}<sub>2</sub> = ${a===1?'':fracBox(fmt(-b),fmt(a))+' = '}<b>${r.h}</b></div>`};
  }
  if(b===0){
    const t=rat(-c,a);
    const h=`<p>Es incompleta (no tiene término en ${x}): ${eq}. Despejamos ${x}<sup>2</sup>:</p><div class="mid">${x}<sup>2</sup> = ${a===1?'':fracBox(fmt(-c),fmt(a))+' = '}${t.h}</div>`;
    if(t.v<0)return {roots:[],h:h+`<p>Un cuadrado no puede ser negativo → <b>no tiene soluciones reales</b>.</p>`};
    const s=sqrtRat(t);
    const r2=s.exact?rat(Math.sqrt(t.p),Math.sqrt(t.q)):{v:s.v,h:s.h},r1=s.exact?rat(-Math.sqrt(t.p),Math.sqrt(t.q)):{v:-s.v,h:'−'+s.h};
    return {roots:[r1,r2],h:h+`<div class="mid">${x} = ±${sq(t.h)}${sq(t.h)!==s.h?` = <b>±${s.h}</b>`:''}</div>`};
  }
  const D=b*b-4*a*c;
  let h=`<p>Resolvemos ${eq} con la fórmula, siendo <span class="m">a = ${fmt(a)}, b = ${fmt(b)}, c = ${fmt(c)}</span>:</p>
    <div class="mid">${x} = ${fracBox(`−<i>b</i> ± ${sq('<i>b</i><sup>2</sup> − 4<i>ac</i>')}`,'2<i>a</i>')} = ${fracBox(`${fmt(-b)} ± ${sq(`${par(b)}<sup>2</sup> − 4·${par(a)}·${par(c)}`)}`,fmt(2*a))} = ${fracBox(`${fmt(-b)} ± ${sq(fmt(D))}`,fmt(2*a))}</div>`;
  if(D<0)return {roots:[],h:h+`<p>El discriminante es negativo (Δ = ${fmt(D)}) → <b>no tiene soluciones reales</b>.</p>`};
  if(D===0){const r=rat(-b,2*a);return {roots:[r],h:h+`<p>Δ = 0 → hay una solución doble:</p><div class="mid">${x} = ${fracBox(fmt(-b),fmt(2*a))} = <b>${r.h}</b></div>`}}
  if(isSq(D)){
    const s=Math.sqrt(D),r1=rat(-b+s,2*a),r2=rat(-b-s,2*a);
    return {roots:[r1,r2],h:h+`<p>Como √${D} = ${s}:</p>
      <div class="mid">${x}<sub>1</sub> = ${fracBox(`${fmt(-b)} + ${s}`,fmt(2*a))} = <b>${r1.h}</b> &nbsp;&nbsp;&nbsp; ${x}<sub>2</sub> = ${fracBox(`${fmt(-b)} − ${s}`,fmt(2*a))} = <b>${r2.h}</b></div>`};
  }
  const {k,m}=sqrtSplit(D);const g=gcd(gcd(b,k),2*a);let B=-b/g,K=k/g,Dd=2*a/g;if(Dd<0){B=-B;Dd=-Dd}
  const mk=s=>{const tail=(K===1?'':K)+sq(m),num=B!==0?fmt(B)+(s>0?' + ':' − ')+tail:(s>0?'':'−')+tail;return {v:(B+s*K*Math.sqrt(m))/Dd,h:Dd===1?num:fracBox(num,Dd)}};
  const r1=mk(1),r2=mk(-1);
  return {roots:[r1,r2],h:h+`<p>${D} no es cuadrado perfecto${k>1?` (${sq(D)} = ${k}${sq(m)})`:''}: las soluciones son irracionales.</p>
    <div class="mid">${x}<sub>1</sub> = <b>${r1.h}</b> ≈ ${dec(r1.v,3)} &nbsp;&nbsp;&nbsp; ${x}<sub>2</sub> = <b>${r2.h}</b> ≈ ${dec(r2.v,3)}</div>`};
}

function finalSols(sols,extra=''){
  const m=new Map();sols.forEach(s=>{const k=s.v.toFixed(9);if(!m.has(k))m.set(k,s)});
  sols=[...m.values()].sort((a,b)=>a.v-b.v);const n=sols.length;
  return {t:'Solución',final:true,h:(n?`<p>${n===1?'La ecuación tiene <b>una solución</b>:':`La ecuación tiene <b>${n} soluciones</b>:`}</p>
    <div class="rootlist">${sols.map(s=>`<span class="root">${X} ${s.rel||'='} ${s.h}</span>`).join('')}</div>`:`<p class="warn">La ecuación <b>no tiene solución real</b>.</p>`)+extra};
}
function finalPairs(pairs,extra=''){
  const m=new Map();pairs.forEach(p=>m.set(p.join(','),p));pairs=[...m.values()].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  return {t:'Solución',final:true,h:`<p>El sistema tiene <b>${pairs.length===1?'una solución':pairs.length+' soluciones'}</b>:</p>
    <div class="rootlist">${pairs.map(([x,y])=>`<span class="root">${X} = ${fmt(x)}, ${Y} = ${fmt(y)}</span>`).join('')}</div>${extra}`};
}

/* =========================================================
   1) BICUADRADAS
   ========================================================= */
function genBi(T){
  const S=[1,4,9,16,25,36];
  for(let t=0;t<500;t++){
    let co;
    if(T==='4'){const [a,b]=shuffle(S).slice(0,2);co=mul([1,-a],[1,-b])}
    else if(T==='2')co=mul([1,-pick(S)],[1,pick([1,2,3,4,9])]);

/* =========================================================

  const num=R.B!==0?fmt(R.B)+(R.s>0?' + ':' − ')+tail:(R.s>0?'':'−')+tail;

const leadStr=a=>a===1?'':a===-1?'−':fmt(a);

    <tr><td class="rc"></td>${cur.map(c=>`<td>${fmt(c)}</td>`).join('')}</tr>
    <tr class="prod"><td class="rc">${fmt(r)}</td><td></td>${prods.map(p=>`<td>${fmt(p)}</td>`).join('')}</tr>

}
const trialChips=trials=>`<div class="chips">${trials.map(([c,v])=>`<span class="chip ${v===0?'ok':''}">P(${fmt(c)}) = ${fmt(v)}${v===0?' ✓':''}</span>`).join('')}</div>`;
function genPoly(deg){
  for(let t=0;t<2000;t++){
    let L=pick([1,1,1,1,1,-1,2,2,-2]);
    const type=pick(['ent','ent','ent','irr','irr','cx','rat','doble']);let quadP;
    if(type==='ent'){const a=ri(-5,5),b=ri(-5,5);quadP=[1,-(a+b),a*b]}

    else if(type==='cx'){const b=ri(-5,5),c=ri(1,10),D=b*b-4*c;if(D>=0)continue;quadP=[1,b,c]}
    else{const LL=pick([2,3,2,-2]);const p=ri(-5,5);if(p===0||gcd(p,LL)!==1)continue;const s=ri(-4,4);quadP=[LL,-(LL*s+p),p*s];L=1}
    let P=quadP.map(c=>c*L);
    const pool=[-3,-2,-2,-1,-1,-1,0,1,1,1,2,2,3,4,-4];
    for(let i=0;i<deg-2;i++)P=mul(P,[1,-pick(pool)]);
    if(Math.max(...P.map(Math.abs))>600)continue;
    if(deg>3&&P[P.length-1]===0&&P[P.length-2]===0&&Math.random()<.7)continue;

}
function solvePoly(P){

    <p>Llamamos <span class="m">P(${X}) = ${polyHTML(P)}</span>. Es de grado ${deg}: aplicaremos Ruffini ${deg-2} ${deg-2===1?'vez':'veces'} para bajar a grado 2 y terminaremos con la fórmula de la ecuación de segundo grado.</p>
    <p class="note">Toda raíz entera de P(${X}) es divisor del término independiente.</p>`});

      <p>Discriminante: <span class="m">Δ = ${b*b} ${4*a*c<0?'+':'−'} ${Math.abs(4*a*c)} = <b>${fmt(D)}</b></span></p>`;

        <div class="mid">${X}<sub>1</sub> = <b>${rootHTML(r1)}</b> ≈ ${dec(rootVal(r1),3)} &nbsp;&nbsp;&nbsp; ${X}<sub>2</sub> = <b>${rootHTML(r2)}</b> ≈ ${dec(rootVal(r2),3)}</div>`}

/* =========================================================
   3) RACIONALES
   ========================================================= */
const denPoly=R=>R.reduce((p,r)=>mul(p,[1,-r]),[1]);

  const neg=lead(T.N)<0,Na=neg?scale(T.N,-1):T.N;
  let body=T.R.length?fracBox(polyHTML(Na),polyHTML(denPoly(T.R))):(neg&&nTerms(Na)>1?'('+polyHTML(Na)+')':polyHTML(Na));

const sideR=ts=>ts.map((t,i)=>fracTerm(t,i===0)).join('');
const stmtRac=E=>sideR(E.L)+' = '+sideR(E.R);
function racPoly(E){
  const all=[...E.L,...E.R];
  const Ls=[...new Set(all.flatMap(t=>t.R))].sort((a,b)=>a-b);
  const mult=t=>Ls.filter(r=>!t.R.includes(r));
  const prod=t=>mul(t.N,denPoly(mult(t)));

}
function genRac(T){
  const nC=()=>[pick([1,2,3,4,5,6,-1,-2,-3,-4])];
  const nL=()=>trim(pick([[1,ri(-4,4)],[1,ri(-4,4)],[2,ri(-3,3)]]));
  const nA=()=>Math.random()<.55?nC():nL();
  for(let t=0;t<30000;t++){
    const rs=shuffle([-4,-3,-2,-1,0,1,2,3,4]);let a=rs[0],b=rs[1],E;
    if(T==='F1')E={L:[{N:nA(),R:[a]},{N:nA(),R:[b]}],R:[{N:[pick([1,2,3,-1,-2,4])],R:[]}]};
    else if(T==='F2'){if(a!==0&&Math.random()<.5)b=-a;E={L:[{N:nA(),R:[a]},{N:nA(),R:[b]}],R:[{N:nA(),R:[a,b]}]}}

    const all=[...E.L,...E.R];

    const {P}=normalize(K.fin);if(Math.max(...P.map(Math.abs))>60)continue;

function solveRac(E){

    else h+=`<p class="m">${polyHTML(denPoly(R))} = ${R.map(lf).join('')} <span class="note">— ${R[0]===-R[1]?'diferencia de cuadrados':`sus raíces son ${fmt(R[0])} y ${fmt(R[1])}`}</span></p>`;
  });

  const expS=ts=>ts.map((t,i)=>{const p=K.prod(t),s=polyHTML(p);return i===0?s:(lead(p)<0?' − '+s.slice(1):' + '+s)}).join('');

  if(g!==1)h2+=`<p>${g===-1?'Multiplicamos por −1':`Dividimos entre ${fmt(g)}`}:</p><div class="mid">${polyHTML(P)} = 0</div>`;
  st.push({t:'Desarrollamos y ordenamos',h:h2});
  const Q=quad(...(P.length===3?P:[0,...P]));st.push({t:'Resolvemos',h:Q.h});

  });

}

/* =========================================================
   4) IRRACIONALES
   ========================================================= */
function genIrr(T){
  for(let t=0;t<5000;t++){
    if(T==='A'){
      const m=pick([1,1,-1]),r1=ri(-4,7),r2=ri(-4,7),d=ri(-3,5);if(r1===r2)continue;
      const p=m===1?2*d+r1+r2:r1+r2-2*d,q=d*d-r1*r2;

      return {T,p,q,m,d,arr:m===1?(d===0?'iso':pick(['iso','minus','plus'])):pick(['iso','sum'])};
    }

    const a=s*s-x0,b=u*u-x0;if(Math.abs(a)>40||Math.abs(b)>40)continue;

  const st=[];

  st.push({t:'Segundo cuadrado',h:`<div class="mid">${pb} = ${u}<sup>2</sup> = ${u*u}</div><div class="mid">${X} = ${u*u} ${b>=0?'−':'+'} ${Math.abs(b)} = <b>${fmt(x0)}</b></div>`});
  st.push({t:'Comprobamos',h:`<div class="chk ok"><span class="m">${X} = ${fmt(x0)}</span>: &nbsp;<span class="m">${sq(subLin(1,a,x0))} ${diff?'−':'+'} ${sq(subLin(1,b,x0))} = ${sq(s*s)} ${diff?'−':'+'} ${sq(u*u)} = ${s} ${diff?'−':'+'} ${u} = ${c}</span> → <b>válida ✓</b></div>`});

}

const condLog=args=>`<p class="note">Condiciones de existencia: el argumento de un logaritmo debe ser positivo → ${args.map(p=>`<span class="m">${polyHTML(p)} &gt; 0</span>`).join(' y ')}.</p>`;

function solveLog(E){

  const sols=Q.roots.map(r=>{const t=r.v,v=t>=0?rat(B**t):rat(1,B**(-t));return {t,v}});
  st.push({t:'Deshacemos el cambio',h:`<p>Por definición de logaritmo: <span class="m">${lg(B,X)} = <i>t</i> ⇔ ${X} = ${PW(B,'<i>t</i>')}</span></p>`+
    sols.map(({t,v})=>`<div class="mid">${lg(B,X)} = ${fmt(t)} &nbsp;→&nbsp; ${X} = ${PW(B,fmt(t))} = <b>${v.h}</b></div>`).join('')+`<p class="note">Las dos son positivas, así que ambas son válidas.</p>`});

      const B=pick([2,3]),pw=B===2?[1,2,4,8]:[1,3,9,27],t1=pick(pw),t2=Math.random()<.25?-pick([1,2,B]):pick(pw);

function genGauss(){

const eq3=r=>`${linHTML([[r[0],X],[r[1],Y],[r[2],Z]])} = ${fmt(r[3])}`;
const matHTML=(M,ops,chg=[])=>`<div class="mxw"><div class="mxs">${M.map((_,i)=>`<div>${EQ(i)}</div>`).join('')}</div>
  <div class="mxb"><table>${M.map((r,i)=>`<tr class="${chg.includes(i)?'chg':''}">${r.map((v,j)=>`<td class="${j===3?'sep':''}">${fmt(v)}</td>`).join('')}</tr>`).join('')}</table></div>
  ${ops?`<div class="mxs ops">${ops.map(o=>`<div>${o||'&nbsp;'}</div>`).join('')}</div>`:''}</div>`;

function genNL(T){

  {id:'irracionales',name:'Irracionales',desc:'La incógnita está bajo una raíz: aislar la raíz, elevar al cuadrado y comprobar.',
    subs:[['mix','Mezcla'],['A','Una raíz'],['B','Dos raíces']],
    make:s=>{const E=genIrr(s);return {E,stmt:stmtIrr(E),solve:()=>solveIrr(E)}}},
  {id:'logaritmicas',name:'Logarítmicas',desc:'Propiedades de los logaritmos, igualar argumentos y comprobar que los logaritmos existen.',
    subs:[['mix','Mezcla'],['suma','Suma de logaritmos'],['resta','Resta de logaritmos'],['doble','n·log A'],['cambio','Cambio de variable']],
    make:s=>{const E=genLog(s);return {E,stmt:stmtLog(E),solve:()=>solveLog(E)}}},
  {id:'exponenciales',name:'Exponenciales',desc:'La incógnita en el exponente: igualar bases, sacar factor común, cambio de variable o tomar logaritmos.',
    subs:[['mix','Mezcla'],['base','Igualar bases'],['factor','Factor común'],['cambio','Cambio de variable'],['logs','Tomando logaritmos']],
    make:s=>{const E=genExp(s);return {E,stmt:stmtExp(E),solve:()=>solveExp(E)}}},
  {id:'gauss',name:'Sistemas 3×3 (Gauss)',desc:'Tres ecuaciones con tres incógnitas y soluciones enteras: matriz ampliada, sistema escalonado y sustitución regresiva.',
    subs:null,make:()=>{const E=genGauss();return {E,stmt:sysHTML([0,1,2].map(i=>eq3([...E.A[i],E.b[i]]))),solve:()=>solveGauss(E)}}},
  {id:'no-lineales',name:'Sistemas no lineales',desc:'Sistemas en los que aparecen x², y² o x·y: sustitución, igualación o reducción.',
    subs:[['mix','Mezcla'],['recta','Recta y cónica'],['sp','x + y, x·y'],['parab','Parábola y recta'],['red','Reducción con x² e y²'],['bic','x² + y² y x·y']],
    make:s=>{const E=genNL(s);return {E,stmt:sysHTML(nlLines(E)),solve:()=>solveNL(E)}}},
];
globalThis.__TABS=TABS;

if(typeof document!=='undefined'&&document.getElementById('list')){
  const $=id=>document.getElementById(id);
  let cur=0,EX=[];const subSel={};
  function setList(list){
    const T=TABS[cur];
    EX=list.map(e=>({...e,steps:null,shown:0}));
    $('list').innerHTML=`<div class="list-head"><h2>${T.name}</h2><span>Pulsa «Ver solución» para resolver cada ejercicio paso a paso</span></div>`+
      EX.map((e,i)=>`<div class="ex" id="ex${i}">
        <div class="ex-head"><span class="num">${i+1}</span><div class="stmt">${e.stmt}</div>
          <button class="btn sm" data-a="open" data-i="${i}">Ver solución</button></div>
        <div class="ex-body hidden" id="exb${i}"><div id="exs${i}"></div>
          <div class="controls">
            <button class="btn" data-a="next" data-i="${i}" id="nx${i}">Siguiente paso ▸</button>
            <button class="btn alt" data-a="all" data-i="${i}" id="al${i}">Ver todos los pasos</button>
            <button class="btn alt" data-a="hide" data-i="${i}" id="hd${i}">Volver a empezar</button>
          </div><div class="progress" id="pg${i}"></div></div></div>`).join('');
  }
  function updEx(i){
    const e=EX[i];
    e.steps.forEach((_,j)=>$(`st${i}_${j}`).classList.toggle('hidden',j>=e.shown));
    $('nx'+i).disabled=$('al'+i).disabled=e.shown>=e.steps.length;
    $('hd'+i).disabled=e.shown<=1;
    $('pg'+i).textContent=`Paso ${e.shown} de ${e.steps.length}`;
  }
  $('list').addEventListener('click',ev=>{
    const b=ev.target.closest('button[data-a]');if(!b)return;
    const i=+b.dataset.i,e=EX[i],a=b.dataset.a;
    if(a==='open'){
      const body=$('exb'+i),open=body.classList.contains('hidden');
      if(open&&!e.steps){
        e.steps=e.solve();e.shown=1;
        $('exs'+i).innerHTML=e.steps.map((s,j)=>`<div class="step hidden ${s.final?'final':''}" id="st${i}_${j}"><h3><span class="num">${s.final?'✓':j+1}</span>${s.t}</h3>${s.h}</div>`).join('');
        updEx(i);
      }
      body.classList.toggle('hidden',!open);$('ex'+i).classList.toggle('open',open);
      b.textContent=open?'Ocultar':'Ver solución';return;
    }
    if(a==='next'){e.shown++;updEx(i);$(`st${i}_${e.shown-1}`).scrollIntoView({behavior:'smooth',block:'nearest'})}
    if(a==='all'){e.shown=e.steps.length;updEx(i)}
    if(a==='hide'){e.shown=1;updEx(i)}
  });
  function generate(){
    const T=TABS[cur],sel=subSel[T.id]||'mix';
    const pool=T.subs?(sel==='mix'?shuffle(T.subs.slice(1).map(s=>s[0])):[sel]):['std'];
    const list=[],seen=new Set();let i=0,guard=0;
    while(list.length<5&&guard++<80){const ex=T.make(pool[i%pool.length]);if(!ex||!ex.E||seen.has(ex.stmt))continue;seen.add(ex.stmt);list.push(ex);i++}
    setList(list);
  }
  function renderTab(){
    const T=TABS[cur];
    $('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${i===cur?'on':''}" data-t="${i}" role="tab" aria-selected="${i===cur}">${t.name}</button>`).join('');
    $('pTitle').textContent=T.name;$('pDesc').textContent=T.desc;
    $('subRow').classList.toggle('hidden',!T.subs);
    if(T.subs){const sel=subSel[T.id]||'mix';$('subs').innerHTML=T.subs.map(([k,l])=>`<button data-s="${k}" class="${k===sel?'on':''}">${l}</button>`).join('')}
    generate();
  }
  $('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;cur=+b.dataset.t;try{history.replaceState(null,'','#'+TABS[cur].id)}catch(_){try{location.hash=TABS[cur].id}catch(__){}}renderTab()});
  $('subs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;subSel[TABS[cur].id]=b.dataset.s;[...$('subs').children].forEach(x=>x.classList.toggle('on',x===b));generate()});
  $('gen').addEventListener('click',generate);
  const fromHash=()=>{const k=TABS.findIndex(t=>'#'+t.id===location.hash);return k<0?0:k};
  window.addEventListener('hashchange',()=>{const k=fromHash();if(k!==cur){cur=k;renderTab()}});
  cur=fromHash();renderTab();
}
}
</script>
</body>
</html>
