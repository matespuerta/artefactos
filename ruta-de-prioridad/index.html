<style>
  :root{

    --paren:#7c5cff; --paren-soft:#efeaff; --paren-border:#cfc0ff;
    --pow:#2f6fed;  --pow-soft:#e8f0ff;  --pow-border:#bcd3fb;
    --muldiv:#1f8a5f; --muldiv-soft:#e3f5ec; --muldiv-border:#a9e0c4;
    --addsub:#b8720a; --addsub-soft:#fbf0dc; --addsub-border:#eecd93;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#10131c; --paper-line:#20263a;
      --ink:#e9ecf7; --ink-soft:#a4adc9;
      --card:#161c2b; --card-border:#272f47;
      --card-shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
      --ghost:#1b2134;
      --paren:#a793ff; --paren-soft:#241f3d; --paren-border:#453a6e;
      --pow:#6fa2ff; --pow-soft:#16223a; --pow-border:#2c4066;
      --muldiv:#42c08a; --muldiv-soft:#163526; --muldiv-border:#2c5c45;
      --addsub:#e3a73d; --addsub-soft:#3a2c12; --addsub-border:#5c451c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#10131c; --paper-line:#20263a;
    --ink:#e9ecf7; --ink-soft:#a4adc9;
    --card:#161c2b; --card-border:#272f47;
    --card-shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    --ghost:#1b2134;
    --paren:#a793ff; --paren-soft:#241f3d; --paren-border:#453a6e;
    --pow:#6fa2ff; --pow-soft:#16223a; --pow-border:#2c4066;
    --muldiv:#42c08a; --muldiv-soft:#163526; --muldiv-border:#2c5c45;
    --addsub:#e3a73d; --addsub-soft:#3a2c12; --addsub-border:#5c451c;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0 1px, transparent 1px calc(28 / 16 * 1rem)),
      repeating-linear-gradient(90deg, var(--paper-line) 0 1px, transparent 1px calc(28 / 16 * 1rem)),
      var(--paper);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;

  .wrap{ max-width:880px; margin-inline:auto; display:flex; flex-direction:column; gap:22px; }

  header{ padding-bottom:14px; border-bottom:2px solid var(--card-border); }
  header h1{
    font-family:'Fraunces',Georgia,serif; font-weight:600;
    font-size:clamp(26px,4vw,38px); margin:0 0 6px; letter-spacing:-0.01em; text-wrap:balance;
  }
  header p{ margin:0; color:var(--ink-soft); font-size:clamp(14px,1.6vw,16px); max-width:60ch; }

  .legend{
    display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12.5px; color:var(--ink-soft);
  }

  .legend i{ width:12px; height:12px; border-radius:4px; display:inline-block; }
  .legend .c-paren{ background:var(--paren); }
  .legend .c-pow{ background:var(--pow); }
  .legend .c-muldiv{ background:var(--muldiv); }
  .legend .c-addsub{ background:var(--addsub); }

  .selector{ display:flex; flex-direction:column; gap:10px; }
  .selector-group{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .selector-group h2{
    font-family:'Karla',sans-serif; font-size:12.5px; font-weight:700;

  }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    font-family:'Space Mono',monospace; font-weight:700; font-size:14px;

    background:var(--muldiv); color:#fff; border-radius:50%; font-size:10px;

  }
  .pill.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pill:focus-visible{ outline:2px solid var(--pow); outline-offset:2px; }

  .stage{
    background:var(--card); border:1px solid var(--card-border); border-radius:20px;
    box-shadow:var(--card-shadow); padding:26px 26px 22px; display:flex; flex-direction:column; gap:18px;
  }
  .stage-eyebrow{

  }

  .expr{
    font-family:'Space Mono',monospace; font-weight:700; font-size:clamp(21px,3.2vw,29px);

  }
  .tok{ white-space:pre; }
  .target{
    display:inline-flex; align-items:center; padding:5px 12px; border-radius:10px;

  }
  .target.tier-paren{ background:var(--paren-soft); border-color:var(--paren); color:var(--paren); }
  .target.tier-pow{ background:var(--pow-soft); border-color:var(--pow); color:var(--pow); }
  .target.tier-muldiv{ background:var(--muldiv-soft); border-color:var(--muldiv); color:var(--muldiv); }
  .target.tier-addsub{ background:var(--addsub-soft); border-color:var(--addsub); color:var(--addsub); }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(0,0,0,0);} 50%{ box-shadow:0 0 0 5px rgba(0,0,0,.04);} }

  .sqrt{ display:inline-flex; align-items:flex-start; }
  .sqrt .rad{ border-top:2px solid currentColor; padding-top:1px; margin-left:1px; }

  .why{ display:flex; flex-direction:column; gap:6px; }
  .why-badge{
    display:inline-flex; align-self:flex-start; align-items:center; gap:7px;
    font-family:'Karla',sans-serif; font-weight:700; font-size:12.5px;
    text-transform:uppercase; letter-spacing:.04em; padding:4px 10px; border-radius:7px;
  }
  .why-badge.tier-paren{ background:var(--paren-soft); color:var(--paren); }
  .why-badge.tier-pow{ background:var(--pow-soft); color:var(--pow); }
  .why-badge.tier-muldiv{ background:var(--muldiv-soft); color:var(--muldiv); }
  .why-badge.tier-addsub{ background:var(--addsub-soft); color:var(--addsub); }
  .why p{ margin:0; font-size:14.5px; color:var(--ink-soft); line-height:1.5; }

  .chain{
    font-family:'Space Mono',monospace; font-size:15px; color:var(--ink-soft);
    background:var(--ghost); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:4px;
  }

  .tip{
    font-size:13.5px; color:var(--ink-soft); background:var(--ghost); border-left:3px solid var(--pow);
    border-radius:0 8px 8px 0; padding:10px 14px; line-height:1.5;
  }

  .progress{ display:flex; align-items:center; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--card-border); flex-shrink:0; }
  .dot.filled{ background:var(--ink-soft); }
  .dot.current{ background:var(--ink); transform:scale(1.3); }
  .progress-label{ font-size:12.5px; color:var(--ink-soft); margin-left:6px; white-space:nowrap; }

  .controls{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
  .nav-btns{ display:flex; gap:10px; }
  button.nav{
    font-family:'Karla',sans-serif; font-weight:700; font-size:14px;
    border-radius:10px; padding:11px 18px; cursor:pointer; transition:all .15s ease; border:1.5px solid;
  }
  button.nav.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  button.nav.primary:hover{ opacity:.9; }
  button.nav.secondary{ background:var(--card); color:var(--ink-soft); border-color:var(--card-border); }
  button.nav.secondary:hover{ color:var(--ink); border-color:var(--ink-soft); }
  button.nav:disabled{ opacity:.35; cursor:not-allowed; }
  button.nav:focus-visible{ outline:2px solid var(--pow); outline-offset:2px; }
  button.reset-mini{
    font-family:'Karla',sans-serif; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; text-decoration:underline; padding:4px;
  }

  .done-banner{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--addsub-soft); border:1.5px solid var(--addsub-border); border-radius:14px; padding:16px 18px;
  }
  .done-banner strong{
    font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(22px,3vw,28px); color:var(--addsub);
  }
  .done-banner span{ font-size:14px; color:var(--ink-soft); }

  @media (max-width:560px){
    .selector-group h2{ width:auto; }
    .controls{ flex-direction:column; align-items:stretch; }
    .nav-btns{ justify-content:space-between; }
  }
  @media (prefers-reduced-motion: reduce){
    .target{ animation:none; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Ruta de prioridad</h1>
    <p>Elige un ejercicio y pulsa «Siguiente paso». Cada casilla de color marca qué operación toca ahora y por qué, hasta llegar al resultado.</p>
  </header>

  <div class="legend">
    <span><i class="c-paren"></i>Paréntesis</span>
    <span><i class="c-pow"></i>Potencias y raíces</span>
    <span><i class="c-muldiv"></i>Multiplicación y división</span>
    <span><i class="c-addsub"></i>Suma y resta</span>
  </div>

  <div class="selector" id="selector"></div>

  <section class="stage" id="stage" aria-live="polite"></section>
</div>

<script>
(function(){
  function SUP(b,e){ return b + '<sup>' + e + '</sup>'; }
  function SQRT(v){ return '<span class="sqrt">√<span class="rad">' + v + '</span></span>'; }

  var EXERCISES = [
    { id:'pc-a', group:'Piensa y calcula', letter:'a', result:'18', frames:[
      { tokens:[SUP('9','2'),'−',SUP('5','2'),'·','2','+',SQRT('4'),'·','6','−','1'], target:{start:0,len:1}, tier:'pow' },
      { tokens:['81','−',SUP('5','2'),'·','2','+',SQRT('4'),'·','6','−','1'], target:{start:2,len:1}, tier:'pow' },
      { tokens:['81','−','25','·','2','+',SQRT('4'),'·','6','−','1'], target:{start:6,len:1}, tier:'pow' },
      { tokens:['81','−','25','·','2','+','2','·','6','−','1'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['81','−','50','+','2','·','6','−','1'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['81','−','50','+','12','−','1'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['31','+','12','−','1'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['43','−','1'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['42'], target:null, tier:null }
    ]},
    { id:'pc-b', group:'Piensa y calcula', letter:'b', result:'17', frames:[
      { tokens:['12','+',SQRT('36'),':','3','+',SUP('2','3'),'−','5'], target:{start:2,len:1}, tier:'pow' },
      { tokens:['12','+','6',':','3','+',SUP('2','3'),'−','5'], target:{start:6,len:1}, tier:'pow' },
      { tokens:['12','+','6',':','3','+','8','−','5'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['12','+','2','+','8','−','5'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['14','+','8','−','5'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['22','−','5'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['17'], target:null, tier:null }
    ]},
    { id:'pc-c', group:'Piensa y calcula', letter:'c', result:'5',
      tip:'Aunque «48 : 6» esté más a la izquierda, primero se resuelven todas las raíces y potencias de la expresión: la raíz √121 va antes que cualquier división.',
      frames:[
      { tokens:['48',':','6','+','66',':',SQRT('121'),'−','9'], target:{start:6,len:1}, tier:'pow' },
      { tokens:['48',':','6','+','66',':','11','−','9'], target:{start:0,len:3}, tier:'muldiv' },
      { tokens:['8','+','66',':','11','−','9'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['8','+','6','−','9'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['14','−','9'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['5'], target:null, tier:null }
    ]},
    { id:'pc-d', group:'Piensa y calcula', letter:'d', result:'59', frames:[
      { tokens:['25','−',SQRT('25'),'·','2','+',SUP('6','2'),':','3','+',SUP('2','5')], target:{start:2,len:1}, tier:'pow' },
      { tokens:['25','−','5','·','2','+',SUP('6','2'),':','3','+',SUP('2','5')], target:{start:6,len:1}, tier:'pow' },
      { tokens:['25','−','5','·','2','+','36',':','3','+',SUP('2','5')], target:{start:9,len:1}, tier:'pow' },
      { tokens:['25','−','5','·','2','+','36',':','3','+','32'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['25','−','10','+','36',':','3','+','32'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['25','−','10','+','12','+','32'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['15','+','12','+','32'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['27','+','32'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['59'], target:null, tier:null }
    ]},
    { id:'r-a', group:'Resuelve', letter:'a', result:'16', frames:[
      { tokens:['12','+','4','·','2','−','(3 + 5)',':','2'], target:{start:6,len:1}, tier:'paren' },
      { tokens:['12','+','4','·','2','−','8',':','2'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['12','+','8','−','8',':','2'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['12','+','8','−','4'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['20','−','4'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['16'], target:null, tier:null }
    ]},
    { id:'r-b', group:'Resuelve', letter:'b', result:'24', frames:[
      { tokens:['31','−','3','·','(16 − 12)','+','30',':','6'], target:{start:4,len:1}, tier:'paren' },
      { tokens:['31','−','3','·','4','+','30',':','6'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['31','−','12','+','30',':','6'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['31','−','12','+','5'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['19','+','5'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['24'], target:null, tier:null }
    ]},
    { id:'r-c', group:'Resuelve', letter:'c', result:'30',
      tip:'El paréntesis se resuelve siempre antes que una raíz, aunque la raíz √81 esté escrita primero.',
      frames:[
      { tokens:[SQRT('81'),'+','12',':','3','+','5','·','(10 − 9 + 2)','+','2'], target:{start:8,len:1}, tier:'paren', chain:['10 − 9 = 1','1 + 2 = 3'] },
      { tokens:[SQRT('81'),'+','12',':','3','+','5','·','3','+','2'], target:{start:0,len:1}, tier:'pow' },
      { tokens:['9','+','12',':','3','+','5','·','3','+','2'], target:{start:2,len:3}, tier:'muldiv' },
      { tokens:['9','+','4','+','5','·','3','+','2'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['9','+','4','+','15','+','2'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['13','+','15','+','2'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['28','+','2'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['30'], target:null, tier:null }
    ]},
    { id:'r-d', group:'Resuelve', letter:'d', result:'64', frames:[
      { tokens:['15','−','4','+','3','·','(12 − 4)',':','6','+',SUP('7','2')], target:{start:6,len:1}, tier:'paren' },
      { tokens:['15','−','4','+','3','·','8',':','6','+',SUP('7','2')], target:{start:9,len:1}, tier:'pow' },
      { tokens:['15','−','4','+','3','·','8',':','6','+','49'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['15','−','4','+','24',':','6','+','49'], target:{start:4,len:3}, tier:'muldiv' },
      { tokens:['15','−','4','+','4','+','49'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['11','+','4','+','49'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['15','+','49'], target:{start:0,len:3}, tier:'addsub' },
      { tokens:['64'], target:null, tier:null }
    ]}
  ];

  var RULES = {
    paren:'Se resuelve primero todo lo que está dentro del paréntesis.',
    pow:'Las potencias y raíces van antes que multiplicar, dividir, sumar o restar.',
    muldiv:'Multiplicar y dividir van antes que sumar y restar. Si hay varias, de izquierda a derecha.',
    addsub:'Ya no quedan paréntesis, potencias, raíces, multiplicaciones ni divisiones: ahora sí, de izquierda a derecha.'
  };
  var TIER_LABEL = { paren:'Paréntesis', pow:'Potencia o raíz', muldiv:'Multiplicación o división', addsub:'Suma o resta' };

  var state = {};
  EXERCISES.forEach(function(ex){ state[ex.id] = 0; });
  var activeId = EXERCISES[0].id;

  var selectorEl = document.getElementById('selector');
  var stageEl = document.getElementById('stage');

  function groups(){
    var seen = [];
    EXERCISES.forEach(function(ex){ if (seen.indexOf(ex.group) === -1) seen.push(ex.group); });
    return seen;
  }

  function renderSelector(){
    var html = '';
    groups().forEach(function(g){
      html += '<div class="selector-group"><h2>' + g + '</h2><div class="pills">';
      EXERCISES.filter(function(ex){ return ex.group === g; }).forEach(function(ex){
        var isActive = ex.id === activeId;
        var isDone = state[ex.id] === ex.frames.length - 1;
        html += '<button class="pill' + (isActive ? ' active' : '') + (isDone ? ' done' : '') +
          '" id="pill-' + ex.id + '" type="button" aria-pressed="' + isActive + '">' + ex.letter + '</button>';
      });
      html += '</div></div>';
    });
    selectorEl.innerHTML = html;
    EXERCISES.forEach(function(ex){
      var btn = document.getElementById('pill-' + ex.id);
      btn.addEventListener('click', function(){ activeId = ex.id; renderAll(); });
    });
  }

  function renderExpr(frame){
    var out = [];
    var i = 0;
    var tokens = frame.tokens;
    while (i < tokens.length){
      if (frame.target && i === frame.target.start){
        var slice = tokens.slice(i, i + frame.target.len).join(' ');
        out.push('<span class="target tier-' + frame.tier + '">' + slice + '</span>');
        i += frame.target.len;
      } else {
        out.push('<span class="tok">' + tokens[i] + '</span>');
        i += 1;
      }
    }
    return out.join('');
  }

  function renderStage(){
    var ex = EXERCISES.filter(function(e){ return e.id === activeId; })[0];
    var idx = state[ex.id];
    var frame = ex.frames[idx];
    var total = ex.frames.length;
    var isFinal = frame.target === null;

    var dots = '';
    for (var d = 0; d < total; d++){
      var cls = 'dot' + (d < idx ? ' filled' : '') + (d === idx ? ' current' : '');
      dots += '<span class="' + cls + '"></span>';
    }

    var html = '';
    html += '<div class="stage-eyebrow">' + ex.group + ' · Ejercicio ' + ex.letter + '</div>';
    html += '<div class="expr">' + renderExpr(frame) + '</div>';

    if (ex.tip) html += '<div class="tip">' + ex.tip + '</div>';

    if (!isFinal){
      html += '<div class="why">';
      html += '<span class="why-badge tier-' + frame.tier + '">' + TIER_LABEL[frame.tier] + '</span>';
      html += '<p>' + RULES[frame.tier] + '</p>';
      html += '</div>';
      if (frame.chain){
        html += '<div class="chain">' + frame.chain.map(function(l){ return '<span>' + l + '</span>'; }).join('') + '</div>';
      }
    } else {
      html += '<div class="done-banner"><strong>= ' + ex.result + '</strong><span>Expresión resuelta aplicando la jerarquía completa.</span></div>';
    }

    html += '<div class="progress">' + dots + '<span class="progress-label">Paso ' + (idx + 1) + ' de ' + total + '</span></div>';

    html += '<div class="controls">';
    html += '<div class="nav-btns">';
    html += '<button class="nav secondary" id="btn-prev" type="button"' + (idx === 0 ? ' disabled' : '') + '>◀ Paso anterior</button>';
    if (!isFinal){
      html += '<button class="nav primary" id="btn-next" type="button">Siguiente paso ▶</button>';
    }
    html += '</div>';
    html += '<button class="reset-mini" id="btn-reset" type="button">Reiniciar este ejercicio</button>';
    html += '</div>';

    stageEl.innerHTML = html;

    var prevBtn = document.getElementById('btn-prev');
    if (prevBtn) prevBtn.addEventListener('click', function(){
      if (state[ex.id] > 0){ state[ex.id]--; renderAll(); }
    });
    var nextBtn = document.getElementById('btn-next');
    if (nextBtn) nextBtn.addEventListener('click', function(){
      if (state[ex.id] < ex.frames.length - 1){ state[ex.id]++; renderAll(); }
    });
    var resetBtn = document.getElementById('btn-reset');
    if (resetBtn) resetBtn.addEventListener('click', function(){ state[ex.id] = 0; renderAll(); });
  }

  function renderAll(){
    renderSelector();
    renderStage();
  }

  renderAll();
})();
</script>

</body></html>
